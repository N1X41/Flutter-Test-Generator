name: test_demo_app
description: Тестовый проект для демонстрации работы плагина автогенерации тестов

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  flutter_bloc: ^8.1.3
  
  # Networking
  dio: ^5.3.2
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Utilities
  equatable: ^2.0.5
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Testing
  bloc_test: ^9.1.4
  mocktail: ^1.0.0
  
  # Code generation
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true 